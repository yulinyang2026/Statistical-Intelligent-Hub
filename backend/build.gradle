plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.bsp'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

compileJava {
    // 编译目标 Java 17 字节码（本机编译 JVM 为 Java 21）
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 口令 BCrypt 哈希（不引入完整 Spring Security 过滤链）
    implementation 'org.springframework.security:spring-security-crypto'
    // 联调期契约核对：/swagger-ui.html
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    // Excel（.xlsx）导入导出：Apache POI（2026-09-11 用户需求：由 CSV 改为 Excel）
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-crypto'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
